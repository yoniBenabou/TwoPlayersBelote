<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coinche for Four</title>
<style>
  :root {
    --bg: #0a0e13; --panel: #121922; --line: #243140; --text: #e6ebf0; --muted: #8c99a8;
    --accent: #2de2a6; --red-suit: #c8282e; --black-suit: #11161c; --gold: #f5c542;
    --felt: #0f2a22; --felt-edge: #0b1f19;
    --cw: clamp(52px, 9vh, 84px); --ch: calc(var(--cw) * 1.413);
    --sw: calc(var(--cw) * .62); --sh: calc(var(--sw) * 1.413);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
  .mono { font-family: "Courier New", monospace; letter-spacing: .08em; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 19px; margin: 0; }
  header .kicker { color: var(--accent); font-size: 11px; font-weight: bold; }
  header .spacer { flex: 1; }
  .badge { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 11px; font-size: 14px; }
  .badge b { font-size: 17px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px;
           font-size: 14px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #062b1f; border-color: var(--accent); font-weight: bold; }
  button.on { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }

  main { display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 12px 20px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  @media (min-width: 1001px) {
    body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    main { flex: 1; min-height: 0; }
    .table { height: 100%; min-height: 0 !important; }
    aside { min-height: 0; overflow-y: auto; }
  }

  /* table */
  .table { position: relative; min-height: 640px; border: 1px solid var(--line); border-radius: 22px; padding: 12px 16px 20px;
           background: radial-gradient(ellipse at center, #154536 0%, var(--felt) 55%, var(--felt-edge) 100%);
           display: grid; grid-template-columns: minmax(130px, 1fr) minmax(300px, 2.2fr) minmax(130px, 1fr);
           grid-template-rows: auto 1fr auto; gap: 8px; }
  .seat { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
  .seat.north { grid-column: 2; grid-row: 1; }
  .seat.west { grid-column: 1; grid-row: 2; justify-content: center; }
  .seat.east { grid-column: 3; grid-row: 2; justify-content: center; }
  .seat.south { grid-column: 1 / 4; grid-row: 3; }
  .center { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 0; }
  .seat-label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .seat-label .name { color: var(--text); font-weight: bold; }
  .seat.turn .seat-label .name { color: var(--accent); }
  .chip { font: bold 10px "Courier New", monospace; letter-spacing: .08em; border-radius: 4px; padding: 2px 6px; }
  .chip.dealer { background: #2a3442; color: var(--text); }
  .chip.taker { background: var(--accent); color: #062b1f; }
  .chip.team { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .bubble { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--accent); color: var(--text);
            border-radius: 999px; padding: 3px 10px; font-size: 13px; white-space: nowrap; animation: pop .3s ease; }
  .seat.north .bubble { bottom: -14px; } .seat.south .bubble { top: -26px; }
  .seat.west .bubble, .seat.east .bubble { top: -6px; }
  .hand { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; min-height: var(--ch); }
  .mini-hand { display: flex; justify-content: center; flex-wrap: wrap; max-width: 100%; min-height: var(--sh); }
  .mini-hand .card { margin: 0 -10px; }
  .seat.west .mini-hand, .seat.east .mini-hand { flex-wrap: nowrap; padding: 0 16px; }
  .seat.west .mini-hand .card, .seat.east .mini-hand .card { margin: 0 calc(var(--sw) * -.38); }
  .seat.west .mini-hand.open, .seat.east .mini-hand.open { flex-wrap: wrap; max-width: calc(var(--sw) * 4.6); gap: 4px; padding: 0; }
  .seat.west .mini-hand.open .card, .seat.east .mini-hand.open .card { margin: 0; }
  .mini-hand.open .card { margin: 0 2px; }

  .trick { display: grid; grid-template-columns: repeat(3, calc(var(--cw) + 10px)); grid-template-rows: repeat(3, calc(var(--ch) * .62));
           gap: 0 8px; align-items: center; justify-items: center; }
  .slot { position: relative; width: calc(var(--cw) + 10px); height: calc(var(--ch) + 8px); display: flex; align-items: center;
          justify-content: center; }
  .slot.north { grid-column: 2; grid-row: 1 / 3; align-self: start; }
  .slot.south { grid-column: 2; grid-row: 2 / 4; align-self: end; }
  .slot.west { grid-column: 1; grid-row: 1 / 4; }
  .slot.east { grid-column: 3; grid-row: 1 / 4; }
  .slot .announce { position: absolute; top: -12px; z-index: 6; font: bold 13px Arial; color: #062b1f; background: var(--gold);
                    border-radius: 999px; padding: 2px 9px; white-space: nowrap; animation: pop .3s ease; }
  .slot.win .card { box-shadow: 0 0 0 3px var(--gold), 0 4px 10px rgba(0,0,0,.45); }
  .banner { min-height: 26px; font-size: 15px; text-align: center; padding: 5px 14px; border-radius: 999px; max-width: 100%;
            background: rgba(10,14,19,.6); border: 1px solid rgba(45,226,166,.25); }
  .turn-hint { font-size: 12px; color: var(--accent); min-height: 16px; }

  /* annonces */
  .bidding { display: none; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  .bidding.show { display: flex; }
  .bid-history { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 520px; font-size: 12px; }
  .bid-history span { border: 1px solid var(--line); background: rgba(10,14,19,.55); border-radius: 999px; padding: 3px 9px; }
  .bid-controls { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .val { min-width: 48px; padding: 6px 8px; }
  .val.sel { background: var(--accent); color: #062b1f; border-color: var(--accent); font-weight: bold; }
  .suit-btn { font-size: 22px; min-width: 52px; padding: 4px 10px; }
  .suit-btn.red { color: #f2545b; }
  .help { font-size: 12px; color: var(--muted); text-align: center; }

  /* cartes */
  .card { width: var(--cw); height: var(--ch); border-radius: 9px; background: linear-gradient(160deg, #fff 0%, #f1f3f5 100%);
          box-shadow: 0 4px 10px rgba(0,0,0,.45); position: relative; user-select: none; flex: none;
          transition: transform .15s ease, box-shadow .15s ease, opacity .15s; }
  .card.red { color: var(--red-suit); } .card.black { color: var(--black-suit); }
  .card .corner { position: absolute; font-weight: bold; line-height: 1; text-align: center; font-size: calc(var(--cw) * .19); }
  .card .corner span { display: block; font-size: calc(var(--cw) * .18); }
  .card .tl { top: 6px; left: 7px; } .card .br { bottom: 6px; right: 7px; transform: rotate(180deg); }
  .card .pip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: calc(var(--cw) * .5); }
  .card .face { position: absolute; inset: calc(var(--cw) * .24) calc(var(--cw) * .2); border: 1.5px solid currentColor; border-radius: 6px;
                display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; }
  .card .face .big { font-size: calc(var(--cw) * .37); } .card .face .s { font-size: calc(var(--cw) * .24); }
  .card.small { width: var(--sw); height: var(--sh); border-radius: 6px; }
  .card.small .corner { font-size: calc(var(--sw) * .22); } .card.small .corner span { font-size: calc(var(--sw) * .2); }
  .card.small .tl { top: 3px; left: 4px; } .card.small .br { bottom: 3px; right: 4px; }
  .card.small .pip { font-size: calc(var(--sw) * .46); } .card.small .face { inset: calc(var(--sw) * .27) calc(var(--sw) * .19); }
  .card.small .face .big { font-size: calc(var(--sw) * .34); } .card.small .face .s { font-size: calc(var(--sw) * .22); }
  .card.trump::after { content: "TRUMP"; position: absolute; bottom: -16px; left: 0; right: 0; text-align: center;
                       font: bold 10px "Courier New", monospace; color: var(--accent); letter-spacing: .1em; }
  .card.small.trump::after { content: none; }
  .card.playable { cursor: pointer; box-shadow: 0 0 0 2px var(--accent), 0 6px 14px rgba(0,0,0,.5); }
  .card.playable:hover { transform: translateY(-12px); }
  .card.illegal { opacity: .38; }
  .card.back { background: repeating-linear-gradient(45deg, #1d3b6b 0 5px, #24497f 5px 10px); border: 3px solid #f1f3f5; }
  .card.pop { animation: pop .3s ease; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

  /* panneau latéral */
  aside { display: flex; flex-direction: column; gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 12px; color: var(--accent); }
  .score-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; font-size: 14px; }
  .score-row b { font-size: 24px; font-family: "Courier New", monospace; }
  .bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
  .bar div { height: 100%; background: var(--muted); transition: width .4s; } .bar.us div { background: var(--accent); }
  .info { font-size: 13px; color: var(--muted); line-height: 1.5; } .info b { color: var(--text); }
  .last-trick { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .log { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; font-size: 13px; }
  .log li { padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
  .log li.strong { color: var(--text); }
  table.hist { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.hist td, table.hist th { padding: 4px 5px; border-bottom: 1px solid var(--line); text-align: right; }
  table.hist th { color: var(--muted); font-weight: normal; } table.hist td:nth-child(-n+2), table.hist th:nth-child(-n+2) { text-align: left; }

  .overlay { position: absolute; inset: 0; background: rgba(10,14,19,.75); border-radius: 22px; display: none; z-index: 20;
             align-items: center; justify-content: center; padding: 20px; }
  .overlay.show { display: flex; }
  .overlay .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 28px; max-width: 640px;
                  max-height: 100%; overflow-y: auto; }
  .overlay h3 { margin: 0 0 8px; font-size: 22px; text-align: center; }
  .overlay p { color: var(--muted); margin: 6px 0 14px; text-align: center; }
  .overlay table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 14px; }
  .overlay td, .overlay th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; }
  .overlay th { color: var(--muted); font-weight: normal; } .overlay td:first-child, .overlay th:first-child { text-align: left; }
  .overlay ol { padding-left: 20px; margin: 0 0 16px; } .overlay li { margin-bottom: 8px; line-height: 1.45; font-size: 14px; }
  .center-btn { text-align: center; }
  .error { color: #f2545b; font-size: 13px; min-height: 16px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker mono">COINCHE · 4 PLAYERS · TEST TABLE</div>
    <h1>You and North against East and West</h1>
  </div>
  <div class="spacer"></div>
  <div class="badge">Deal <b id="deal">–</b></div>
  <div class="badge">Contract <b id="contract">–</b></div>
  <button id="rules">Rules</button>
  <button id="reveal">Show all hands</button>
  <button id="new-game">New game</button>
</header>

<main>
  <section class="table" id="table">
    <div class="seat north" id="seat-north">
      <div class="seat-label"><span class="name">North</span><span class="chip team mono">PARTNER</span><span class="chip dealer mono" id="dealer-north"></span><span class="chip taker mono" id="taker-north"></span></div>
      <div class="mini-hand" id="hand-north"></div>
    </div>
    <div class="seat west" id="seat-west">
      <div class="seat-label"><span class="name">West</span><span class="chip dealer mono" id="dealer-west"></span><span class="chip taker mono" id="taker-west"></span></div>
      <div class="mini-hand" id="hand-west"></div>
    </div>
    <div class="center">
      <div class="bidding" id="bidding">
        <div class="bid-history" id="bid-history"></div>
        <div class="bid-controls" id="bid-controls"></div>
      </div>
      <div class="trick" id="trick">
        <div class="slot north" id="slot-north"></div>
        <div class="slot west" id="slot-west"></div>
        <div class="slot east" id="slot-east"></div>
        <div class="slot south" id="slot-south"></div>
      </div>
      <div class="banner" id="banner">Loading…</div>
      <div class="turn-hint mono" id="turn-hint"></div>
      <div class="error" id="error"></div>
    </div>
    <div class="seat east" id="seat-east">
      <div class="seat-label"><span class="name">East</span><span class="chip dealer mono" id="dealer-east"></span><span class="chip taker mono" id="taker-east"></span></div>
      <div class="mini-hand" id="hand-east"></div>
    </div>
    <div class="seat south" id="seat-south">
      <div class="seat-label"><span class="name">You (South)</span><span class="chip dealer mono" id="dealer-south"></span><span class="chip taker mono" id="taker-south"></span></div>
      <div class="hand" id="hand-south"></div>
    </div>
    <div class="overlay" id="overlay"><div class="box" id="overlay-box"></div></div>
  </section>

  <aside>
    <div class="panel">
      <h2 class="mono">SCORE · FIRST TO <span id="target">1000</span></h2>
      <div class="score-row"><span>You &amp; North</span><b id="total-0">0</b></div>
      <div class="bar us"><div id="bar-0" style="width:0"></div></div>
      <div class="score-row"><span>East &amp; West</span><b id="total-1">0</b></div>
      <div class="bar"><div id="bar-1" style="width:0"></div></div>
    </div>
    <div class="panel">
      <h2 class="mono">THIS DEAL</h2>
      <div class="info" id="deal-info">–</div>
    </div>
    <div class="panel">
      <h2 class="mono">LAST TRICK</h2>
      <div class="last-trick" id="last-trick"><span class="info">No trick played yet.</span></div>
    </div>
    <div class="panel">
      <h2 class="mono">GAME LOG</h2>
      <ul class="log" id="log"></ul>
    </div>
    <div class="panel">
      <h2 class="mono">DEALS</h2>
      <table class="hist" id="hist"><tr><th>#</th><th>Contract</th><th>Us</th><th>Them</th></tr></table>
    </div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Temps d'affichage de chaque événement (ms).
const DELAY = { bid: 1100, yourBid: 500, card: 1000, yourCard: 450, announce: 1800, trick: 1700, message: 1400 };
const SEATS = ["south", "east", "north", "west"];
const NAMES = { south: "You", east: "East", north: "North", west: "West" };
let view = null, busy = false, selectedValue = null;

function cardEl(c, { small = false, classes = [] } = {}) {
  const el = document.createElement("div");
  if (c.hidden) { el.className = ["card back", small ? "small" : "", ...classes].join(" "); return el; }
  el.className = ["card", c.color, small ? "small" : "", ...classes].join(" ");
  const face = ["J", "Q", "K"].includes(c.rank);
  el.innerHTML = `<div class="corner tl">${c.rank}<span>${c.suit}</span></div>
    ${face ? `<div class="face"><span class="big">${c.rank}</span><span class="s">${c.suit}</span></div>` : `<div class="pip">${c.suit}</div>`}
    <div class="corner br">${c.rank}<span>${c.suit}</span></div>`;
  el.title = `${c.label}${c.points !== undefined ? ` · ${c.points} pts` : ""}`;
  return el;
}
function log(text, strong = false) { const li = document.createElement("li"); li.textContent = text; if (strong) li.className = "strong"; $("log").prepend(li); }
function banner(text) { $("banner").textContent = text; }
function bubble(seat, text, ms = 1600) {
  const s = $(`seat-${seat}`); const b = document.createElement("div"); b.className = "bubble"; b.textContent = text;
  s.append(b); setTimeout(() => b.remove(), ms);
}

function renderTrick(trick, winner = null) {
  for (const seat of SEATS) {
    const slot = $(`slot-${seat}`); slot.innerHTML = ""; slot.classList.toggle("win", winner === seat);
    const e = trick.find((t) => t.seat === seat);
    if (e) {
      slot.append(cardEl(e.card, { classes: ["pop"] }));
      if (e.announce) { const a = document.createElement("span"); a.className = "announce"; a.textContent = e.announce; slot.append(a); }
    }
  }
}

function renderBidding(s) {
  const show = s.phase === "bidding";
  $("bidding").classList.toggle("show", show);
  $("trick").style.display = show ? "none" : "grid";
  if (!show) return;
  $("bid-history").innerHTML = s.bids.length
    ? s.bids.map((b) => `<span>${NAMES[b.seat]}: ${b.label}</span>`).join("")
    : '<span>No bid yet</span>';
  const box = $("bid-controls"); box.innerHTML = "";
  const o = s.bidOptions;
  if (!o || busy) { box.innerHTML = `<div class="help mono">WAITING FOR ${(NAMES[s.current] || "").toUpperCase()}…</div>`; return; }
  if (selectedValue !== null && !o.values.some((v) => v.value === selectedValue)) selectedValue = null;
  const help = document.createElement("div"); help.className = "help";
  help.textContent = o.values.length ? "Choose a contract, then its trump suit — or pass" : "Pass, or answer the coinche";
  box.append(help);
  if (o.values.length) {
    const vals = document.createElement("div"); vals.className = "row";
    for (const v of o.values) {
      const b = document.createElement("button"); b.className = "val" + (selectedValue === v.value ? " sel" : "");
      b.textContent = v.label; b.onclick = () => { selectedValue = v.value; renderBidding(view); };
      vals.append(b);
    }
    box.append(vals);
    const suits = document.createElement("div"); suits.className = "row";
    for (const su of o.suits) {
      const b = document.createElement("button"); b.className = "suit-btn" + (su.color === "red" ? " red" : "");
      b.textContent = su.symbol; b.title = su.name; b.disabled = selectedValue === null;
      b.onclick = () => bid({ kind: "bid", value: selectedValue, suit: su.name });
      suits.append(b);
    }
    box.append(suits);
  }
  const acts = document.createElement("div"); acts.className = "row";
  const pass = document.createElement("button"); pass.textContent = "Pass"; pass.onclick = () => bid({ kind: "pass" }); acts.append(pass);
  if (o.coinche) { const b = document.createElement("button"); b.className = "primary"; b.textContent = "Coinche! (×2)"; b.onclick = () => bid({ kind: "coinche" }); acts.append(b); }
  if (o.surcoinche) { const b = document.createElement("button"); b.className = "primary"; b.textContent = "Surcoinche! (×4)"; b.onclick = () => bid({ kind: "surcoinche" }); acts.append(b); }
  box.append(acts);
}

function render() {
  const s = view;
  $("deal").textContent = s.dealNo;
  $("contract").innerHTML = s.contract
    ? `<span style="color:${s.contract.suit.color === "red" ? "#f2545b" : "inherit"}">${s.contract.label}</span>${s.contract.mult > 1 ? ` ×${s.contract.mult}` : ""}`
    : "–";
  $("target").textContent = s.target;
  for (const t of [0, 1]) {
    $(`total-${t}`).textContent = s.totals[t];
    $(`bar-${t}`).style.width = Math.min(100, (100 * s.totals[t]) / s.target) + "%";
  }
  $("reveal").classList.toggle("on", s.reveal);
  $("reveal").textContent = s.reveal ? "Hide other hands" : "Show all hands";
  for (const seat of SEATS) {
    $(`dealer-${seat}`).textContent = s.dealer === seat ? "DEALER" : "";
    $(`dealer-${seat}`).style.display = s.dealer === seat ? "" : "none";
    const taker = s.contract && s.contract.by === seat && s.phase !== "bidding";
    $(`taker-${seat}`).textContent = taker ? "TAKER" : ""; $(`taker-${seat}`).style.display = taker ? "" : "none";
    $(`seat-${seat}`).classList.toggle("turn", s.current === seat && !busy);
    if (seat === "south") continue;
    const h = $(`hand-${seat}`); h.innerHTML = ""; h.classList.toggle("open", s.reveal);
    for (const c of s.hands[seat]) h.append(cardEl(c, { small: true, classes: c.isTrump ? ["trump"] : [] }));
  }
  const mine = $("hand-south"); mine.innerHTML = "";
  for (const c of s.hands.south) {
    const playable = s.yourTurn && !busy && c.legal;
    const classes = [];
    if (s.trump && c.suitName === s.trump.name) classes.push("trump");
    if (s.yourTurn && !busy) classes.push(playable ? "playable" : "illegal");
    const el = cardEl(c, { classes }); if (playable) el.onclick = () => play(c.id); mine.append(el);
  }
  $("turn-hint").textContent = busy || s.phase === "done" ? "" : s.yourTurn ? "YOUR TURN — CLICK A HIGHLIGHTED CARD" : s.yourBid ? "YOUR BID" : "";
  renderBidding(s);
  const info = [];
  if (s.contract) {
    info.push(`Contract: <b>${s.contract.label}</b>${s.contract.mult > 1 ? ` <b>×${s.contract.mult}</b>` : ""} by <b>${s.contract.byLabel}</b> (${s.contract.team})`);
    if (s.phase !== "bidding") info.push(`Tricks: us <b>${s.tricksWon[0]}</b> (${s.trickPoints[0]} pts) · them <b>${s.tricksWon[1]}</b> (${s.trickPoints[1]} pts)`);
  } else info.push("Bidding in progress");
  $("deal-info").innerHTML = info.join("<br>");
  const lt = $("last-trick"); lt.innerHTML = "";
  if (s.lastTrick) {
    for (const t of s.lastTrick.cards) lt.append(cardEl(t.card, { small: true }));
    const i = document.createElement("span"); i.className = "info";
    i.textContent = `Trick ${s.lastTrick.trickNo} → ${NAMES[s.lastTrick.winner]} (+${s.lastTrick.points})`; lt.append(i);
  } else lt.innerHTML = '<span class="info">No trick played yet.</span>';
  const hist = $("hist"); hist.querySelectorAll("tr.r").forEach((r) => r.remove());
  for (const h of s.history) {
    const tr = document.createElement("tr"); tr.className = "r";
    tr.innerHTML = `<td>${h.deal}</td><td>${h.contract}${h.mult > 1 ? " ×" + h.mult : ""} ${h.by} ${h.made ? "✓" : "✗"}</td><td>${h.scores[0]}</td><td>${h.scores[1]}</td>`;
    hist.append(tr);
  }
  renderOverlay();
}

function renderOverlay() {
  const s = view, ov = $("overlay"), box = $("overlay-box");
  if (ov.dataset.rules === "1") return;
  if (s.phase !== "done" || busy) { ov.classList.remove("show"); return; }
  const r = s.result;
  const rows = [["Tricks won", r.tricksWon[0], r.tricksWon[1]], ["Trick points" + (r.capot ? " (capot = 250)" : ""), r.points[0], r.points[1]],
                ["Belote-rebelote", r.belote[0], r.belote[1]], ["Total for the contract", r.total[0], r.total[1]],
                ["<b>Score this deal</b>", `<b>${r.scores[0]}</b>`, `<b>${r.scores[1]}</b>`]];
  const head = s.gameOver ? (s.totals[0] > s.totals[1] ? "You and North win the game!" : "East and West win the game")
                          : `Contract ${r.made ? "made" : "failed"}`;
  box.innerHTML = `<h3>${head}</h3><p>${r.text}</p>
    <table><tr><th></th><th>You &amp; North</th><th>East &amp; West</th></tr>
    ${rows.map((x) => `<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join("")}</table>
    ${s.gameOver ? `<p>Final score: ${s.totals[0]} – ${s.totals[1]}</p>` : ""}
    <div class="center-btn"><button class="primary" id="ov-btn">${s.gameOver ? "New game" : "Next deal"}</button></div>`;
  $("ov-btn").onclick = s.gameOver ? newGame : nextDeal;
  ov.classList.add("show");
}

function showRules() {
  const ov = $("overlay"), box = $("overlay-box");
  ov.dataset.rules = "1";
  box.innerHTML = `<h3>Rules used at this table</h3><ol>${view.rules.map((r) => `<li>${r}</li>`).join("")}</ol>
    <div class="center-btn"><button class="primary" id="ov-close">Close</button></div>`;
  $("ov-close").onclick = () => { delete ov.dataset.rules; ov.classList.remove("show"); renderOverlay(); };
  ov.classList.add("show");
}

async function replay(state) {
  busy = true;
  let trick = view ? [...view.trick] : [];
  for (const ev of state.events) {
    if (ev.deal) {
      if (view) {
        view.hands = { south: ev.hand.map((c) => ({ ...c, legal: false })) };
        for (const s of ["east", "north", "west"]) view.hands[s] = Array.from({ length: 8 }, () => ({ hidden: true }));
        Object.assign(view, { bids: [], contract: null, trump: null, phase: "bidding", lastTrick: null, trick: [], result: null,
                              tricksWon: [0, 0], trickPoints: [0, 0], dealNo: state.dealNo, dealer: state.dealer });
        trick = []; renderTrick(trick); render();
      }
      banner(ev.text); log(ev.text, true); await sleep(DELAY.message);
    } else if (ev.type === "bid") {
      if (view) { view.bids = [...view.bids, { seat: ev.seat, label: ev.label }]; render(); }
      bubble(ev.seat, ev.label, ev.seat === "south" ? 900 : DELAY.bid + 300);
      banner(ev.text); log(ev.text, ev.label !== "Pass");
      await sleep(ev.seat === "south" ? DELAY.yourBid : DELAY.bid);
    } else if (ev.type === "play") {
      if (view) {
        if (view.phase === "bidding") { view.phase = "play"; view.trump = { name: ev.card.suitName }; }
        const h = view.hands[ev.seat];
        const i = h.findIndex((c) => c.hidden || c.id === ev.card.id);
        if (i >= 0) view.hands[ev.seat] = h.filter((_, k) => k !== i);
        render();
      }
      if (trick.length === 4) trick = [];
      trick.push({ seat: ev.seat, card: ev.card, announce: ev.announce }); renderTrick(trick);
      const text = ev.text; banner(text); log(text, !!ev.announce);
      await sleep(ev.announce ? DELAY.announce : ev.seat === "south" ? DELAY.yourCard : DELAY.card);
    } else if (ev.type === "trick") {
      renderTrick(trick, ev.winner); banner(ev.text); log(ev.text, true);
      await sleep(DELAY.trick); trick = []; renderTrick(trick);
    } else {
      banner(ev.text); log(ev.text, true); await sleep(DELAY.message);
    }
  }
  busy = false; view = state; render(); renderTrick(state.trick);
  if (state.yourBid) banner("Your bid");
  else if (state.yourTurn) banner(state.trick.length ? "Your turn" : "Your turn: lead a card");
}

async function api(path, body) {
  $("error").textContent = "";
  const res = await fetch(path, { method: body === undefined ? "GET" : "POST", headers: { "Content-Type": "application/json" },
                                  body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) { $("error").textContent = data.error || "Error"; throw new Error(data.error); }
  return data;
}
async function act(path, body) { if (busy) return; busy = true; render(); try { await replay(await api(path, body)); } catch { busy = false; render(); } }
const bid = (b) => { selectedValue = null; return act("/api/bid", b); };
const play = (id) => act("/api/play", { card: id });
const nextDeal = () => { $("overlay").classList.remove("show"); return act("/api/next", {}); };
const newGame = () => { $("overlay").classList.remove("show"); $("log").innerHTML = ""; return act("/api/new", {}); };

$("new-game").onclick = newGame;
$("rules").onclick = () => { if (view) showRules(); };
$("reveal").onclick = async () => { if (busy || !view) return; const s = await api("/api/reveal", { on: !view.reveal });
  view.hands = s.hands; view.reveal = s.reveal; render(); };

(async () => {
  const s = await api("/api/state");
  view = s; render(); renderTrick(s.trick);
  banner(s.yourBid ? "Your bid" : s.yourTurn ? "Your turn" : "Click “New game” to start");
  for (const b of s.bids) log(`${NAMES[b.seat]}: ${b.label}`);
})();
</script>
